; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy31]
; Pinned for reproducible package builds. 5.0.0 = toolchain-gccarmnoneeabi-teensy
; ~1.110301.0 (GCC 11.3) + framework-arduinoteensy ~1.159; the GCC 15 toolchain
; that teensy@5.2.0 pulls in fails to compile this firmware on Windows.
platform = teensy@5.0.0
board = teensy31
framework = arduino
build_flags = !python build_flags.py
build_unflags = -O2
upload_protocol = teensy-cli
lib_deps = InputDebounce
; build_type = debug
; Optimized firmware (-O2) causes issues with communication/update_state.
; Using -Os (size optimization) instead, which is standard for embedded.